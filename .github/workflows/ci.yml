name: Mineralogy 26.2 NeoForge CI

on:
  push:
    branches:
      - master-26.2-neo
      - 'feature/**'
  pull_request:
    branches:
      - master-26.2-neo

permissions:
  contents: read

concurrency:
  group: mineralogy-26.2-neo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-bootstrap:
    name: Cold NeoForge bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Bootstrap an isolated empty NeoGradle cache
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test ! -d .gradle
          export GRADLE_USER_HOME="$RUNNER_TEMP/mineralogy-neoforge-cold-cache"
          rm -rf "$GRADLE_USER_HOME"
          gradle_jdk_args=(
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew help --no-daemon --no-build-cache --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
          ./gradlew help --offline --no-daemon --no-build-cache --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"

  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Stage exact OreSpawn release dependency
        id: orespawn
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/orespawn-mirror"
          bash gradle/stage-orespawn-release.sh "$mirror"
          echo "repository=$mirror" >> "$GITHUB_OUTPUT"
      - name: Build, test, and audit release artifacts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          gradle_jdk_args=(
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME"
            -Dorg.gradle.java.installations.auto-detect=false
            -Dorg.gradle.java.installations.auto-download=false
          )
          ./gradlew clean \
            -PorespawnVerificationRepository="${{ steps.orespawn.outputs.repository }}" \
            --no-daemon --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
          ./gradlew check build javadoc verifyReleaseConfiguration verifyReleaseDependencies verifyReleaseArtifacts writeReleaseChecksums \
            -PorespawnVerificationRepository="${{ steps.orespawn.outputs.repository }}" \
            --no-daemon --stacktrace --max-workers=2 "${gradle_jdk_args[@]}"
      - name: Generate and audit Eclipse production launches
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew eclipse verifyEclipseProductionClasspath \
            -PorespawnVerificationRepository="${{ steps.orespawn.outputs.repository }}" \
            --no-daemon --stacktrace --max-workers=2 \
            "-Dorg.gradle.java.installations.paths=$JAVA_HOME" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mineralogy-26.2-neoforge-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/Mineralogy-6.1.2.2602002.jar
            build/libs/Mineralogy-6.1.2.2602002-sources.jar
            build/libs/Mineralogy-6.1.2.2602002-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mineralogy-26.2-neoforge-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
