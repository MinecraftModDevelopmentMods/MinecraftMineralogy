// NeoGradle stores downloaded vanilla executables in its project-local cache.
// Preserve complete cached executables during an offline rerun; missing or
// incomplete entries still execute normally and retain NeoGradle's diagnostic.
tasks.matching { task -> task.name.startsWith('cacheVersionExecutable') }.configureEach {
    onlyIf {
        Set<File> cachedOutputs = outputs.files.files
        !gradle.startParameter.offline || cachedOutputs.isEmpty()
                || !cachedOutputs.every { it.exists() }
    }
}

// Forward OreSpawn's opt-in qualification properties to disposable development
// servers. These are build-only controls implemented by the exact released
// OreSpawn jar; Mineralogy does not ship a second world-generation harness.
def configureOreSpawnQualification = { run ->
    [
            orespawnBenchmarkMode       : 'orespawn.worldgenBenchmarkMode',
            orespawnBenchmarkRadius     : 'orespawn.worldgenBenchmarkRadius',
            orespawnBenchmarkRepetitions: 'orespawn.worldgenBenchmarkRepetitions',
            orespawnBenchmarkVanillaOres: 'orespawn.worldgenBenchmarkVanillaOres',
            orespawnBenchmarkOreAudit   : 'orespawn.worldgenBenchmarkOreAudit',
            orespawnBenchmarkFluidAudit : 'orespawn.worldgenBenchmarkFluidAudit',
            orespawnBenchmarkBiomeAudit : 'orespawn.worldgenBenchmarkBiomeAudit',
            orespawnBenchmarkBlockAudit : 'orespawn.worldgenBenchmarkBlockAudit',
            orespawnBenchmarkCenterX    : 'orespawn.worldgenBenchmarkCenterX',
            orespawnBenchmarkCenterZ    : 'orespawn.worldgenBenchmarkCenterZ',
            orespawnBenchmarkCenterStep : 'orespawn.worldgenBenchmarkCenterStep',
            orespawnBenchmarkDimension  : 'orespawn.worldgenBenchmarkDimension',
            orespawnBenchmarkBiomeType  : 'orespawn.worldgenBenchmarkBiomeType'
    ].each { propertyName, systemName ->
        if (providers.gradleProperty(propertyName).isPresent()) {
            run.systemProperty systemName, providers.gradleProperty(propertyName).get()
        }
    }
    if (providers.gradleProperty('orespawnBenchmarkMode').isPresent()) {
        run.systemProperty 'orespawn.worldgenBenchmarkStopServer', 'true'
    }
}

runs {
