def developmentModOutput = layout.buildDirectory.dir('forge-run-mod-classes/main')
def prepareDevelopmentMod = tasks.register('prepareDevelopmentMod', Sync) {
    group = 'ide'
    description = 'Merges production classes and resources for Forge 65 development discovery.'
    dependsOn tasks.named('classes')
    from sourceSets.main.output.classesDirs
    from sourceSets.main.output.resourcesDir
    into developmentModOutput
}

def configureForge65Run = { JavaExec runTask, String launchTarget ->
    runTask.dependsOn prepareDevelopmentMod
    runTask.doFirst {
        Set<String> splitOutputs = sourceSets.main.output.files.collect {
            it.canonicalFile.absolutePath
        } as Set
        Collection<File> targetClasspath = runTask.classpath.files.findAll {
            !splitOutputs.contains(it.canonicalFile.absolutePath)
        }
        runTask.classpath = files(developmentModOutput, targetClasspath)
        runTask.environment 'MOD_CLASSES', "mineralogy%%${developmentModOutput.get().asFile}"
        // Forge scans the mods directory before FML creates it and logs an
        // otherwise harmless ERROR on a completely fresh run directory.
        File modsDirectory = new File(runTask.workingDir, 'mods')
        if (!modsDirectory.isDirectory() && !modsDirectory.mkdirs()) {
            throw new GradleException("Could not create development mods directory: ${modsDirectory}")
        }
    }
}

tasks.withType(JavaExec).configureEach { JavaExec runTask ->
