            throw new GradleException("Generated Maven POM does not exist: ${pomFile}")
        }
        def pom = new XmlSlurper(false, false).parse(pomFile)
        def actual = [pom.groupId.text(), pom.artifactId.text(), pom.version.text()]
        def expected = [expectedMavenGroup, expectedMavenArtifact, project.version.toString()]
        if (project.group.toString() != expectedMavenGroup || actual != expected) {
            throw new GradleException("Expected Maven coordinate ${expected.join(':')}, found ${actual.join(':')}")
        }
    }
}

tasks.register('verifyMavenizerCompatibilityFixture') {
    group = 'verification'
    description = 'Verifies the sealed target-aware ForgeGradle Mavenizer compatibility tool.'
    inputs.files mavenizerFixtureChecksums.keySet()
    doLast {
        mavenizerFixtureChecksums.each { fixture, expected ->
            if (!fixture.isFile()) {
                throw new GradleException("Missing Mavenizer compatibility fixture: ${fixture}")
            }
            String actual = sha256Of(fixture)
            if (actual != expected) {
                throw new GradleException("Mavenizer compatibility fixture checksum mismatch for " +
                        "${fixture.name}: expected ${expected}, found ${actual}")
            }
        }

        def parsed = new JsonSlurper().parse(mavenizerRuleManifest.asFile)
        String target = 'net.minecraftforge:forge:26.2-65.1.0'
        if (parsed.schema != 1 || parsed.targets.keySet() != [target] as Set) {
            throw new GradleException('Mavenizer target-rule manifest has unexpected targets or schema')
        }
        def forgeRules = parsed.targets[target]
        if (forgeRules.expectedApplications != 0 || !forgeRules.rules.isEmpty()) {
            throw new GradleException('Forge 65 Mavenizer target must be an explicit zero-rule qualification')
        }

        ZipFile fixtureJar = new ZipFile(mavenizerCompatibilityJar.asFile)
        try {
            def embeddedEntry = fixtureJar.getEntry(
                    'META-INF/orespawn/minecraft-source-compatibility.json')
            if (embeddedEntry == null) {
                throw new GradleException('Mavenizer fixture is missing its embedded target-rule manifest')
            }
            byte[] embedded = fixtureJar.getInputStream(embeddedEntry).withCloseable { it.readAllBytes() }
            byte[] external = mavenizerRuleManifest.asFile.bytes
            if (!Arrays.equals(embedded, external)) {
                throw new GradleException('Embedded and externally audited Mavenizer manifests differ')
            }

            def patcherEntry = fixtureJar.getEntry(
                    'net/minecraftforge/mcmaven/impl/util/SourceCompatibilityPatcher.class')
            if (patcherEntry == null) {
                throw new GradleException('Mavenizer fixture is missing SourceCompatibilityPatcher')
            }
            byte[] classHeader = fixtureJar.getInputStream(patcherEntry).withCloseable {
                it.readNBytes(8)
            }
            if (classHeader.length != 8 || classHeader[0..3] !=
                    [0xCA, 0xFE, 0xBA, 0xBE].collect { (byte) it }) {
                throw new GradleException('Mavenizer compatibility class has an invalid class header')
            }
            int classMajor = ((classHeader[6] & 0xff) << 8) | (classHeader[7] & 0xff)
            if (classMajor != 69) {
                throw new GradleException("Mavenizer compatibility tool must use Java 25 bytecode, found ${classMajor}")
            }

            def jarManifestEntry = fixtureJar.getEntry('META-INF/MANIFEST.MF')
            Manifest jarManifest = new Manifest(fixtureJar.getInputStream(jarManifestEntry))
            if (jarManifest.mainAttributes.getValue('Main-Class') !=
                    'net.minecraftforge.mcmaven.cli.Main') {
                throw new GradleException('Mavenizer compatibility fixture has an unexpected main class')
            }
        } finally {
            fixtureJar.close()
        }

        String readme = mavenizerReadme.asFile.getText('UTF-8')
        String patchText = mavenizerSourcePatch.asFile.getText('UTF-8')
        String licenseText = mavenizerLicense.asFile.getText('UTF-8')
        if (!readme.contains('6968241ce7a0a902cdc1c534b976e8373a423091')
                || !readme.contains('Temurin `25.0.3+9`')
                || !readme.contains('26.2-65.1.0')) {
            throw new GradleException('Mavenizer provenance, target, or Java 25 build instructions are incomplete')
        }
        if (!patchText.contains('SourceCompatibilityPatcher.java')
                || !patchText.contains('minecraft-source-compatibility.json')) {
            throw new GradleException('Mavenizer source patch is incomplete')
        }
        if (!licenseText.contains('GNU LESSER GENERAL PUBLIC LICENSE')) {
            throw new GradleException('Mavenizer LGPL-2.1 licence fixture is incomplete')
        }
    }
}

def java25Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.ADOPTIUM
}
tasks.register('verifyJava25Toolchain') {
    group = 'verification'
    description = 'Verifies the exact Temurin Java 25 runtime used by Forge 65.'
    doLast {
        def metadata = java25Launcher.get().metadata
        String runtimeVersion = metadata.javaRuntimeVersion
        if (project.java_toolchain_version != '25.0.3+9'
                || metadata.vendor.toString() != 'Eclipse Temurin'
                || !(runtimeVersion == '25.0.3+9' || runtimeVersion == '25.0.3+9-LTS')) {
            throw new GradleException("Expected Temurin ${project.java_toolchain_version}, found " +
                    "${metadata.vendor} ${runtimeVersion} at ${metadata.installationPath}")
        }
    }
}

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Verifies the exact Mineralogy 26.2 release identity.'
    dependsOn tasks.named('verifyMavenizerCompatibilityFixture')
    doLast {
        if (project.mod_version != '6.1.2.2602001'
                || project.mod_group != expectedMavenGroup
                || project.minecraft_version != '26.2'
                || project.forge_version != '65.1.0'
                || project.mcp_mappings_channel != 'official'
                || project.mcp_mappings_version != '26.2') {
            throw new GradleException('Unexpected Mineralogy 26.2 release identity')
        }
    }
}

tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    description = 'Resolves and verifies the exact released OreSpawn dependency.'
    doLast {
        if (project.mod_version != '6.1.2.2602001'
                || project.minecraft_version != project.mc_version
                || project.mc_version != '26.2'
                || project.loader_name != 'forge'
                || project.loader_code != '1'
                || project.java_version != '25'
                || project.java_toolchain_version != '25.0.3+9'
                || project.gradle_java_version != '25'
                || project.curseforge_project_id != '240974') {
            throw new GradleException('Unexpected generic release dispatcher metadata')
        }
        if (project.orespawn_version != '4.0.16.2602001' ||
                project.orespawn_curse_project_id != '245586' ||
                project.orespawn_curse_file_id != '8798746') {
            throw new GradleException('Unexpected OreSpawn release coordinates')
        }
        File artifact = configurations.orespawnRelease.resolvedConfiguration.resolvedArtifacts
                .find { it.moduleVersion.id.group == 'curse.maven' && it.file.name.endsWith('.jar') }?.file
        if (artifact == null || !artifact.isFile()) {
            throw new GradleException('Released OreSpawn artifact did not resolve')
        }
        String sha = MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString().toUpperCase()
        if (sha != project.orespawn_sha256) {
            throw new GradleException("OreSpawn SHA-256 mismatch: ${sha}")
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the three distributable jars and their production contents.'
    dependsOn tasks.named('verifyReleaseConfiguration')
    dependsOn tasks.named('assemble')
    doLast {
        File libs = file("${buildDir}/libs")
        def actual = fileTree(libs) { include 'Mineralogy-*.jar' }.files.collect { it.name }.sort()
        def expectedSorted = expectedReleaseNames.collect().sort()
        if (actual != expectedSorted) {
            throw new GradleException("Expected exactly ${expectedSorted}, found ${actual}")
        }
        expectedReleaseNames.each { artifactName ->
            ZipFile artifactZip = new ZipFile(new File(libs, artifactName))
            try {
                def artifactNames = artifactZip.entries().collect { it.name }
                if (artifactNames.any { it.startsWith('com/mcmoddev/mineralogy/') ||
                        it.startsWith('zone/moddev/mc/mineralogy/worldgen/') ||
                        it.startsWith('zone/moddev/mc/mineralogy/probe/') ||
                        it.startsWith('zone/moddev/mc/mineralogy/fixture/') ||
                        it.startsWith('zone/moddev/mc/mineralogy/test/') ||
                        it.startsWith('ci-fixtures/') || it.contains('minecraft-mavenizer') ||
                        it.startsWith('src/test/') ||
                        it == 'META-INF/coremods.json' || it.startsWith('coremods/') ||
                        it == 'AGENTS.md' || it.contains('/agent-notes/') }) {
                    throw new GradleException("${artifactName} contains a retired, test, probe, or agent-only path")
                }
            }
            finally {
                artifactZip.close()
            }
        }
        File main = new File(libs, mainReleaseName)
        ZipFile zip = new ZipFile(main)
        try {
            def names = zip.entries().collect { it.name } as Set
            [
                    'META-INF/mods.toml',
                    'mineralogy.mixins.json',
                    'zone/moddev/mc/mineralogy/Mineralogy.class',
                    'data/mineralogy/orespawn/provider.json',
                    'META-INF/mineralogy/docs/README.md',
                    'META-INF/mineralogy/docs/examples/mineralogy-provider.json',
                    'assets/mineralogy/lang/en_us.json'
            ].each { required ->
                if (!names.contains(required)) throw new GradleException("Release jar is missing ${required}")
            }
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            if (manifestEntry == null) throw new GradleException('Release jar is missing META-INF/MANIFEST.MF')
            def manifestStream = zip.getInputStream(manifestEntry)
            try {
                def manifest = new java.util.jar.Manifest(manifestStream)
                def actualMavenCoordinate = manifest.mainAttributes.getValue('Maven-Artifact')
                if (actualMavenCoordinate != expectedMavenCoordinate) {
                    throw new GradleException("Expected manifest Maven-Artifact ${expectedMavenCoordinate}, found ${actualMavenCoordinate}")
                }
                if (manifest.mainAttributes.getValue('MixinConfigs') != 'mineralogy.mixins.json') {
                    throw new GradleException('Release jar does not declare the required Mineralogy mixin configuration')
                }
            }
            finally {
                manifestStream.close()
            }
            if (names.any { it.startsWith('com/mcmoddev/mineralogy/') ||
                    it.startsWith('zone/moddev/mc/mineralogy/worldgen/') ||
                    it.startsWith('zone/moddev/mc/mineralogy/probe/') ||
                    it.startsWith('zone/moddev/mc/mineralogy/fixture/') ||
                    it.startsWith('zone/moddev/mc/mineralogy/test/') ||
                    it.startsWith('ci-fixtures/') || it.contains('minecraft-mavenizer') ||
                    it == 'META-INF/coremods.json' || it.startsWith('coremods/') ||
                    it == 'AGENTS.md' || it.contains('/agent-notes/') }) {
                throw new GradleException('Release jar contains a retired, test, probe, or agent-only path')
            }
            if (names.any { String name ->
                    name.matches('data/[^/]+/(recipes|advancements|loot_tables)/.*') ||
                    name.matches('data/[^/]+/tags/(items|blocks|fluids)/.*')
            }) {
                throw new GradleException('Release jar contains a stale pre-1.21 plural data directory')
            }
            def miningTagContracts = [
                    'data/minecraft/tags/block/mineable/pickaxe.json': [1133, 1080],
                    'data/minecraft/tags/block/needs_iron_tool.json': [123, 120],
                    'data/minecraft/tags/block/needs_stone_tool.json': [329, 320]
            ]
            miningTagContracts.each { tagName, contract ->
                def entry = zip.getEntry(tagName)
                if (entry == null) throw new GradleException("Release jar is missing ${tagName}")
                def tag = new JsonSlurper().parse(zip.getInputStream(entry))
                if (tag.containsKey('optional')) {
                    throw new GradleException("${tagName} uses an unsupported top-level optional field")
                }
                if (tag.values.size() != contract[0]) {
                    throw new GradleException("${tagName} must contain ${contract[0]} values")
                }
                def optionalEntries = tag.values.findAll { it instanceof Map }
                if (optionalEntries.size() != contract[1] || !optionalEntries.every {
                        it.keySet() == ['id', 'required'] as Set &&
                                it.id instanceof String && it.id.startsWith('mineralogy:') &&
                                it.required == false
                }) {
                    throw new GradleException("${tagName} has invalid optional tag entries")
                }
                def ids = tag.values.collect { it instanceof Map ? it.id : it } as Set
                if (ids.size() != tag.values.size()) {
                    throw new GradleException("${tagName} contains duplicate entries")
                }
            }
            def locales = names.findAll { it ==~ /assets\/mineralogy\/lang\/[a-z_]+\.json/ }
            if (locales.size() != 17) {
                throw new GradleException("Release jar must contain 17 locales, found ${locales.size()}")
            }
            def legacyItemModels = names.findAll { it ==~ /assets\/mineralogy\/models\/item\/[^\/]+\.json/ }
            def itemDefinitions = names.findAll { it ==~ /assets\/mineralogy\/items\/[^\/]+\.json/ }
            if (legacyItemModels.size() != 1144 || itemDefinitions.size() != 928) {
                throw new GradleException('Release jar must contain 1,144 legacy item models and 928 Forge 65 item definitions')
            }
            itemDefinitions.each { definitionName ->
                String id = definitionName.substring(
                        'assets/mineralogy/items/'.length(), definitionName.length() - '.json'.length())
                if (id.endsWith('_double_slab') || (id.startsWith('lit_') && id.endsWith('_furnace'))) {
                    throw new GradleException("Hidden block unexpectedly has an item definition: ${id}")
                }
                def definition = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(definitionName)))
                if (definition.model?.type != 'minecraft:model' ||
                        definition.model?.model != "mineralogy:item/${id}") {
                    throw new GradleException("Invalid Forge 65 item definition: ${definitionName}")
                }
            }
            zip.entries().findAll { !it.directory && it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                def stream = zip.getInputStream(entry)
                try {
                    if (stream.read(header) != 8 || header[0..3] != [(byte) 0xca, (byte) 0xfe, (byte) 0xba, (byte) 0xbe]) {
                        throw new GradleException("Invalid class header in ${entry.name}")
                    }
                    int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                    if (major != 69) throw new GradleException("${entry.name} is class version ${major}, expected Java 25 (69)")
                }
                finally {
                    stream.close()
                }
            }
            def provider = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('data/mineralogy/orespawn/provider.json')))
            if (provider.schema_version != 4 || provider.provider_revision != 3 ||
                    provider.rocks.size() != 32 || provider.ores.size() != 3 || provider.fluid_deposits.size() != 1) {
                throw new GradleException('Packaged provider contract is invalid')
            }
            def oil = provider.fluid_deposits['mineralogy:fluid_deposit/crude_oil']
                    ?.dimensions?.get('minecraft:overworld')
            if (!provider.rocks.values().every { it.min_y == -64 && it.max_y == 319 }
                    || oil?.min_y != -48 || oil?.max_y != 48) {
                throw new GradleException('Packaged provider does not use Minecraft 26.2 world heights')
            }
            if (provider.rocks['mineralogy:rock/minecraft/basalt']?.block != 'minecraft:basalt' ||
                    provider.rocks['mineralogy:rock/minecraft/tuff']?.block != 'minecraft:tuff' ||
                    provider.profile_defaults?.worldgen_aliases != [
                            'mineralogy:andesite': 'minecraft:andesite',
                            'mineralogy:basalt': 'minecraft:basalt',
                            'mineralogy:diorite': 'minecraft:diorite',
                            'mineralogy:granite': 'minecraft:granite',
                            'mineralogy:tuff': 'minecraft:tuff'
                    ] || provider.profile_defaults?.terrain_dimensions?.get('minecraft:overworld')?.host_blocks !=
                            ['minecraft:stone', 'minecraft:deepslate'] ||
                    !provider.ores.values().every { ore ->
                        def dimension = ore.dimensions?.get('minecraft:overworld')
                        dimension?.host_blocks == ['minecraft:stone', 'minecraft:deepslate'] &&
                                dimension?.host_tags == []
                    }) {
                throw new GradleException('Packaged provider does not use the Minecraft 26.2 native-rock and deepslate contract')
            }
            byte[] providerBytes = zip.getInputStream(
                    zip.getEntry('data/mineralogy/orespawn/provider.json')).bytes
            byte[] exampleBytes = zip.getInputStream(zip.getEntry(
                    'META-INF/mineralogy/docs/examples/mineralogy-provider.json')).bytes
            if (!java.util.Arrays.equals(providerBytes, exampleBytes)) {
                throw new GradleException('Packaged provider example differs from the authoritative provider')
            }
            String recipePrefix = 'data/mineralogy/recipe/'
            String advancementPrefix = 'data/mineralogy/advancement/recipes/'
            def recipes = names.findAll { it.startsWith(recipePrefix) && it.endsWith('.json') &&
                    !it.substring(recipePrefix.length()).contains('/') }
            def advancements = names.findAll { it.startsWith(advancementPrefix) && it.endsWith('.json') &&
                    !it.substring(advancementPrefix.length()).contains('/') }
            if (recipes.size() != 1433 || advancements.size() != 1433) {
                throw new GradleException("Release jar must contain 1433 recipes and advancements, found ${recipes.size()} and ${advancements.size()}")
            }
            def allTheRocks = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(
                    'data/mineralogy/advancement/mineralogy/all_the_rocks.json')))
            if (allTheRocks.display?.icon?.id != 'mineralogy:basalt'
                    || allTheRocks.display.icon.containsKey('item')) {
                throw new GradleException('Custom advancement icon must use the Minecraft 26.2 item-stack id field')
            }
            def verifyAdvancementPredicates = { advancement, String source ->
                advancement.criteria?.each { criterionName, criterion ->
                    if (criterion.trigger == 'minecraft:inventory_changed') {
                        def predicates = criterion.conditions?.items
                        if (!(predicates instanceof Collection) || predicates.any { predicate ->
                            if (predicate.item != null || predicate.tag != null || predicate.items == null) return true
                            def holderSet = predicate.items
                            return holderSet instanceof Collection
                                    ? holderSet.isEmpty() || holderSet.any { !(it instanceof String) || it.isEmpty() }
                                    : !(holderSet instanceof String) || holderSet.isEmpty()
                        }) {
                            throw new GradleException("Invalid Minecraft 26.2 item predicate in ${source}: ${criterionName}")
                        }
                    }
                }
            }
            names.findAll {
                it.startsWith('data/mineralogy/advancement/recipes/') && it.endsWith('.json') &&
                        !it.endsWith('/_factories.json')
            }.each { entryName ->
                def advancement = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(entryName)))
                if (advancement.sends_telemetry_event != false) {
                    throw new GradleException("Minecraft 26.2 recipe advancement must disable telemetry: ${entryName}")
                }
                if (advancement.criteria != null) verifyAdvancementPredicates(advancement, entryName)
            }
            def slabBridges = ['andesite', 'diorite', 'granite'].collectMany { family ->
                [
                        [name: "${family}_slab_to_vanilla", source: "mineralogy:${family}_slab", result: "minecraft:${family}_slab"],
                        [name: "${family}_slab_from_vanilla", source: "minecraft:${family}_slab", result: "mineralogy:${family}_slab"],
                        [name: "${family}_smooth_slab_to_vanilla", source: "mineralogy:${family}_smooth_slab", result: "minecraft:polished_${family}_slab"],
                        [name: "${family}_smooth_slab_from_vanilla", source: "minecraft:polished_${family}_slab", result: "mineralogy:${family}_smooth_slab"]
                ]
            } + [
                    [name: 'tuff_slab_to_vanilla', source: 'mineralogy:tuff_slab', result: 'minecraft:tuff_slab'],
                    [name: 'tuff_slab_from_vanilla', source: 'minecraft:tuff_slab', result: 'mineralogy:tuff_slab'],
                    [name: 'tuff_smooth_slab_to_vanilla', source: 'mineralogy:tuff_smooth_slab', result: 'minecraft:polished_tuff_slab'],
                    [name: 'tuff_smooth_slab_from_vanilla', source: 'minecraft:polished_tuff_slab', result: 'mineralogy:tuff_smooth_slab'],
                    [name: 'tuff_brick_slab_to_vanilla', source: 'mineralogy:tuff_brick_slab', result: 'minecraft:tuff_brick_slab'],
                    [name: 'tuff_brick_slab_from_vanilla', source: 'minecraft:tuff_brick_slab', result: 'mineralogy:tuff_brick_slab']
            ]
            slabBridges.each { bridge ->
                def recipe = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(
                        "data/mineralogy/recipe/${bridge.name}.json")))
                def advancement = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(
                        "data/mineralogy/advancement/recipes/${bridge.name}.json")))
                if (recipe.type != 'minecraft:crafting_shapeless' || recipe.ingredients?.size() != 1 ||
                        recipe.ingredients[0] != bridge.source || recipe.result?.id != bridge.result ||
                        recipe.result?.count != 1 || recipe['forge:condition']?.type != 'forge:and' ||
                        recipe['forge:condition']?.values?.size() != 2 ||
                        advancement['forge:condition'] != recipe['forge:condition'] ||
                        advancement.criteria?.has_rock?.conditions?.items?.getAt(0)?.items != bridge.source) {
                    throw new GradleException("Invalid native/Mineralogy slab conversion: ${bridge.name}")
                }
            }
            def minecraftRecipes = names.findAll { it.startsWith('data/minecraft/recipe/') && it.endsWith('.json') }
            def cobblestoneOverrides = ['furnace', 'brewing_stand', 'lever', 'piston',
                    'dispenser', 'dropper', 'observer', 'mossy_cobblestone_from_vine',
                    'mossy_cobblestone_from_moss_block', 'andesite', 'diorite', 'stone_axe',
                    'stone_hoe', 'stone_pickaxe', 'stone_shovel', 'stone_sword',
                    'coast_armor_trim_smithing_template',
                    'sentry_armor_trim_smithing_template',
                    'vex_armor_trim_smithing_template']
            def slabOverrides = ['andesite', 'diorite', 'granite'].collectMany { family ->
                ["${family}_slab", "polished_${family}_slab",
                 "${family}_slab_from_${family}_stonecutting",
                 "polished_${family}_slab_from_${family}_stonecutting",
                 "polished_${family}_slab_from_polished_${family}_stonecutting"]
            } + ['tuff_slab', 'polished_tuff_slab', 'tuff_brick_slab',
                 'tuff_slab_from_tuff_stonecutting',
                 'polished_tuff_slab_from_tuff_stonecutting',
                 'polished_tuff_slab_from_polished_tuff_stonecutting',
                 'tuff_brick_slab_from_tuff_stonecutting',
                 'tuff_brick_slab_from_polished_tuff_stonecutting',
                 'tuff_brick_slab_from_tuff_bricks_stonecutting']
            def polishedOverrides = ['andesite', 'basalt', 'diorite', 'granite', 'tuff'].collect {
                "polished_${it}"
            }
            def expectedMinecraftRecipes = (cobblestoneOverrides + slabOverrides + polishedOverrides).collect {
                "data/minecraft/recipe/${it}.json"
            } as Set
            if ((minecraftRecipes as Set) != expectedMinecraftRecipes || minecraftRecipes.size() != 48) {
                throw new GradleException('Release jar must contain exactly 19 cobblestone, 24 slab, and five polished-block recipe overrides')
            }
            cobblestoneOverrides.each { recipe ->
                def data = new JsonSlurper().parse(zip.getInputStream(zip.getEntry("data/minecraft/recipe/${recipe}.json")))
                if (data.type != 'forge:conditional' || data.recipes?.size() != 2 ||
                        data.recipes[0]['forge:condition']?.type != 'mineralogy:config' ||
                        data.recipes[0]['forge:condition']?.flag != 'COBBLESTONE_EQUIVILENT' ||
                        data.recipes[1]['forge:condition']?.type != 'forge:not') {
                    throw new GradleException("Invalid conditional cobblestone override: ${recipe}")
                }
                if (recipe.startsWith('mossy_cobblestone_from_') &&
                        !data.recipes.every { it.recipe?.group == 'mossy_cobblestone' }) {
                    throw new GradleException("Mossy cobblestone override lost its vanilla recipe group: ${recipe}")
                }
                if (recipe in ['furnace', 'brewing_stand'] &&
                        !data.recipes.every { !it.recipe.containsKey('category') }) {
                    throw new GradleException("Minecraft 26.2 recipe must omit removed category: ${recipe}")
                }
            }
            ['coast', 'sentry', 'vex'].each { template ->
                String recipeName = "${template}_armor_trim_smithing_template"
                def data = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(
                        "data/minecraft/recipe/${recipeName}.json")))
                String result = "minecraft:${recipeName}"
                if (data.recipes[0].recipe?.key?.C != '#mineralogy:cobblestone_equivalents'
                        || data.recipes[1].recipe?.key?.C != 'minecraft:cobblestone'
                        || !data.recipes.every { branch ->
                            branch.recipe?.pattern == ['#S#', '#C#', '###']
                                    && branch.recipe?.key?.S == result
                                    && branch.recipe?.key?.get('#') == 'minecraft:diamond'
                                    && branch.recipe?.result?.id == result
                                    && branch.recipe?.result?.count == 2
                                    && !branch.recipe.containsKey('category')
                                    && branch.recipe?.show_notification == true
                        }) {
                    throw new GradleException("Invalid armor-trim cobblestone override: ${recipeName}")
                }
            }
            slabOverrides.each { recipe ->
                def data = new JsonSlurper().parse(zip.getInputStream(zip.getEntry("data/minecraft/recipe/${recipe}.json")))
                if (data.type != 'forge:conditional' || data.recipes?.size() != 2 ||
                        data.recipes[0]['forge:condition']?.type != 'forge:item_exists' ||
                        data.recipes[1]['forge:condition']?.type != 'forge:not') {
                    throw new GradleException("Invalid conditional Mineralogy slab override: ${recipe}")
                }
                data.recipes.each { branch ->
                    def nested = branch.recipe
                    if (recipe.endsWith('_stonecutting')) {
                        if (!(nested.result instanceof Map) || nested.result.id == null
                                || nested.result.count != 2 || nested.containsKey('count')) {
                            throw new GradleException("Invalid Minecraft 26.2 stonecutting result: ${recipe}")
                        }
                    } else if (nested.result?.id == null) {
                        throw new GradleException("Invalid Minecraft 26.2 slab result: ${recipe}")
                    }
                }
            }
            def families = ['andesite', 'basalt', 'diorite', 'granite', 'rhyolite',
                    'pegmatite', 'diabase', 'gabbro', 'peridotite', 'basaltic_glass',
                    'scoria', 'tuff', 'shale', 'conglomerate', 'dolomite', 'limestone',
                    'siltstone', 'marble', 'slate', 'schist', 'gneiss', 'phyllite',
                    'amphibolite', 'hornfels', 'quartzite', 'novaculite', 'rock_salt']
            def unionTags = [
                cobblestone_equivalents: '#c:cobblestones',
                stone_crafting_materials: '#minecraft:stone_crafting_materials',
                stone_tool_materials: '#minecraft:stone_tool_materials'
            ]
            unionTags.each { tag, base ->
                def entry = zip.getEntry("data/mineralogy/tags/item/${tag}.json")
                def values = entry == null ? [] : new JsonSlurper().parse(zip.getInputStream(entry)).values
                def expected = [base] + families.collect { "#mineralogy:stones/${it}" }
                if (values != expected) throw new GradleException("Invalid Mineralogy recipe union tag: ${tag}")
            }
            if (!families.every { names.contains("data/mineralogy/tags/block/stones/${it}.json".toString()) }) {
                throw new GradleException('Release jar must contain all 27 raw-rock family block tags')
            }
            def advancementCategories = [
                furnace: 'decorations', brewing_stand: 'brewing', lever: 'redstone',
                piston: 'redstone', dispenser: 'redstone', dropper: 'redstone',
                observer: 'redstone', mossy_cobblestone_from_vine: 'building_blocks',
                mossy_cobblestone_from_moss_block: 'building_blocks',
                andesite: 'building_blocks', diorite: 'building_blocks',
                stone_axe: 'tools', stone_hoe: 'tools', stone_pickaxe: 'tools',
                stone_shovel: 'tools', stone_sword: 'combat'
            ]
            def expectedMinecraftAdvancements = advancementCategories.collect { recipe, category ->
                "data/minecraft/advancement/recipes/${category}/${recipe}.json"
            } as Set
            expectedMinecraftAdvancements.addAll(['andesite', 'basalt', 'diorite', 'granite', 'tuff'].collect {
                "data/minecraft/advancement/recipes/building_blocks/polished_${it}.json"
            })
            def minecraftAdvancements = names.findAll {
                it.startsWith('data/minecraft/advancement/recipes/') && it.endsWith('.json')
            } as Set
            if (minecraftAdvancements != expectedMinecraftAdvancements) {
                throw new GradleException('Release jar must contain exactly 16 cobblestone and five polished-block advancement overrides')
            }
            advancementCategories.each { recipe, category ->
                def data = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(
                        "data/minecraft/advancement/recipes/${category}/${recipe}.json")))
                def branches = data['forge:conditional']
                if (branches?.size() != 2 ||
                        branches[0]['forge:condition']?.type != 'mineralogy:config' ||
                        branches[1]['forge:condition']?.type != 'forge:not') {
                    throw new GradleException("Invalid conditional advancement override: ${recipe}")
                }
                branches.eachWithIndex { branch, index ->
                    if (branch.sends_telemetry_event != false) {
                        throw new GradleException("Conditional advancement must disable telemetry: ${recipe}")
                    }
                    verifyAdvancementPredicates(branch,
                            "minecraft:${category}/${recipe} branch ${index}")
                }
            }
            ['andesite', 'basalt', 'diorite', 'granite', 'tuff'].each { family ->
                String entryName = "data/minecraft/advancement/recipes/building_blocks/polished_${family}.json"
                def advancement = new JsonSlurper().parse(zip.getInputStream(zip.getEntry(entryName)))
                if (advancement.sends_telemetry_event != false) {
                    throw new GradleException("Polished-block advancement must disable telemetry: ${entryName}")
                }
                verifyAdvancementPredicates(advancement, entryName)
            }
            def wallBlockstates = names.findAll { it ==~ /assets\/mineralogy\/blockstates\/.+_wall\.json/ }
            def tallWallModels = names.findAll { it ==~ /assets\/mineralogy\/models\/block\/.+_wall_side_tall\.json/ }
            if (wallBlockstates.size() != 108 || tallWallModels.size() != 108) {
                throw new GradleException("Release jar must contain all 108 Forge 65 wall blockstates and tall-side models")
            }
        }
        finally {
            zip.close()
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    dependsOn tasks.named('verifyReleaseArtifacts')
    doLast {
        File output = file("${buildDir}/release/SHA256SUMS")
        output.parentFile.mkdirs()
        output.setText(expectedReleaseNames.collect().sort().collect { name ->
            File artifact = file("${buildDir}/libs/${name}")
            String hash = MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
            "${hash}  ${name}"
        }.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Verifies the immutable artifact bundle supplied to Maven publication.'
    inputs.files {
        preparedReleaseDir == null ? [] :
                (expectedReleaseNames + ['SHA256SUMS', 'CHANGELOG.txt']).collect {
                    new File(preparedReleaseDir.toString(), it)
                }
    }
    doLast {
        if (preparedReleaseDir == null) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }
        File prepared = file(preparedReleaseDir.toString())
        if (!prepared.isDirectory()) {
            throw new GradleException("Prepared release directory does not exist: ${prepared}")
        }

        def expectedBundleNames = (expectedReleaseNames + ['SHA256SUMS', 'CHANGELOG.txt']).sort()
        def actualBundleNames = prepared.listFiles().findAll { it.isFile() }.collect { it.name }.sort()
        if (actualBundleNames != expectedBundleNames) {
            throw new GradleException("Expected prepared bundle ${expectedBundleNames}, found ${actualBundleNames}")
        }

        File checksumFile = new File(prepared, 'SHA256SUMS')
        def declaredChecksums = [:]
        checksumFile.readLines('UTF-8').findAll { !it.trim().isEmpty() }.each { line ->
            def match = line =~ /^([0-9a-fA-F]{64})  (.+)$/
            if (!match.matches()) {
                throw new GradleException("Invalid prepared checksum line: ${line}")
            }
            declaredChecksums[match[0][2]] = match[0][1].toLowerCase()
        }
        if (declaredChecksums.keySet().sort() != expectedReleaseNames.sort()) {
            throw new GradleException('Prepared checksums do not declare exactly the three release jars')
        }
        declaredChecksums.each { name, expectedHash ->
            File artifact = new File(prepared, name)
            String actualHash = MessageDigest.getInstance('SHA-256')
                    .digest(artifact.bytes).encodeHex().toString()
            if (actualHash != expectedHash) {
                throw new GradleException("Prepared checksum mismatch for ${name}")
            }
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    description = 'Prevents Maven publication from silently targeting a local or incomplete repository.'
    doLast {
        if (!System.getenv('MAVEN_UPLOAD_URL')
                || !System.getenv('MAVEN_UPLOAD_USERNAME')
                || !System.getenv('MAVEN_UPLOAD_PASSWORD')) {
            throw new GradleException('MAVEN_UPLOAD_URL, MAVEN_UPLOAD_USERNAME, and MAVEN_UPLOAD_PASSWORD are required')
        }
        if (System.getenv('MAVEN_UPLOAD_URL').startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn(preparedReleaseDir == null
            ? tasks.named('verifyReleaseArtifacts')
            : tasks.named('verifyPreparedReleaseArtifacts'))
}

tasks.register('syncForge65EclipseLaunches') {
    group = 'ide'
    dependsOn tasks.named('processResources')
    mustRunAfter tasks.named('genEclipseRuns')
    doLast {
        String mainClass = 'net.minecraftforge.userdev.LaunchTesting'
        String mainOutput = new File(projectDir, 'bin/main').absolutePath
        String modClasses = "mineralogy%%${mainOutput}"
        String eclipseGradleJavaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
        def escapePreference = { String value ->
            value.replace('\\', '\\\\').replace(':', '\\:')
        }
        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        if (!buildshipPreferences.parentFile.isDirectory()
                && !buildshipPreferences.parentFile.mkdirs()) {
            throw new GradleException("Could not create ${buildshipPreferences.parentFile}")
        }
        buildshipPreferences.setText([
                'arguments=',
                'auto.sync=false',
                'build.scans.enabled=false',
                'connection.gradle.distribution=GRADLE_DISTRIBUTION(WRAPPER)',
                "connection.gradle.user.home=${escapePreference(gradle.gradleUserHomeDir.absolutePath)}",
                'connection.project.dir=',
                'eclipse.preferences.version=1',
                "gradle.user.home=${escapePreference(gradle.gradleUserHomeDir.absolutePath)}",
                "java.home=${escapePreference(eclipseGradleJavaHome)}",
                'jvm.arguments=',
                'offline.mode=false',
                'override.workspace.settings=true',
                'show.console.view=false',
                'show.executions.view=false',
                ''
        ].join('\r\n'), 'UTF-8')
        // Forge 65 loads the mod solely from Eclipse's merged bin/main output.
        // Copy the processed production resources as a normal doLast action so
        // token-expanded metadata and externally edited JSON cannot lag behind
        // the source tree without making bin/main a Gradle-owned task output.
        // Eclipse rewrites sourceSets.main.output.resourcesDir to bin/main.
        // Always copy from Gradle's actual processResources destination.
        File processedResources = processedMainResourcesDirectory()
        copy {
            from processedResources
            into mainOutput
        }
        ['Client', 'Server'].each { String runName ->
            File launch = file("run${runName}.launch")
            if (!launch.isFile()) throw new GradleException("Missing generated Eclipse launch ${launch}")
            String text = launch.getText('UTF-8')
            if (text.contains('<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>')) {
                String entries =
                        "    <mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>\r\n"
                text = text.replace(
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables"/>',
                        '<mapAttribute key="org.eclipse.debug.core.environmentVariables">\r\n' +
                        entries + '</mapAttribute>')
            }
            if (!text.contains('<mapEntry key="MOD_CLASSES"')) {
                text = text.replaceFirst(
                        /<mapAttribute key="org\.eclipse\.debug\.core\.environmentVariables">\r?\n/,
                        { String environmentHeader ->
                            environmentHeader +
                                    "    <mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>\r\n"
                        })
            }
            text = text.replace('<stringAttribute key="org.eclipse.jdt.launching.MAIN_TYPE" value=""/>',
                    "<stringAttribute key=\"org.eclipse.jdt.launching.MAIN_TYPE\" value=\"${mainClass}\"/>")
            text = text.replaceFirst(
                    /<stringAttribute key="org.eclipse.jdt.launching.PROJECT_ATTR" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement(
                            "<stringAttribute key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"/>"))
            text = text.replaceFirst(/<mapEntry key="MOD_CLASSES" value="[^"]*"\/>/,
                    java.util.regex.Matcher.quoteReplacement("<mapEntry key=\"MOD_CLASSES\" value=\"${modClasses}\"/>"))
            // Slime Launcher tokenizes these program arguments itself. Quote
            // every complete path because this workspace name contains spaces.
            def programArguments = text =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (programArguments.count != 1) {
                throw new GradleException("ForgeGradle generated malformed program arguments in ${launch.name}")
            }
            String arguments = programArguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int valueStart = arguments.indexOf(prefix)
                if (valueStart < 0) {
                    if (flag in ['to-srg', 'to-obf']) {
                        return
                    }
                    throw new GradleException("ForgeGradle omitted required --${flag} from ${launch.name}")
                }
                valueStart += prefix.length()
                int valueEnd = arguments.indexOf(' --', valueStart)
                if (valueEnd < 0) {
                    throw new GradleException("ForgeGradle generated an unterminated --${flag} path in ${launch.name}")
                }
                String value = arguments.substring(valueStart, valueEnd)
                if (!value.startsWith('&quot;') || !value.endsWith('&quot;')) {
                    arguments = "${arguments.substring(0, valueStart)}&quot;${value}&quot;${arguments.substring(valueEnd)}"
                }
            }
            text = text.replace(programArguments[0][0],
                    programArguments[0][1] + arguments + programArguments[0][3])

            // Some ForgeGradle/Slime Launcher combinations emit this VM
            // argument and some do not. Quote it when present, without making
            // the Forge 65 launch depend on an obsolete argument.
            String legacyClassPathPrefix = '-DlegacyClassPath.file='
            int legacyClassPathStart = text.indexOf(legacyClassPathPrefix)
            if (legacyClassPathStart >= 0) {
                int legacyClassPathEnd = text.indexOf(' -DignoreList=', legacyClassPathStart)
                if (legacyClassPathEnd < 0) {
                    throw new GradleException("ForgeGradle generated an unterminated -DlegacyClassPath.file in ${launch.name}")
                }
                String xmlQuote = '&quot;'
                boolean legacyClassPathQuoted = legacyClassPathStart >= xmlQuote.length()
                        && text.substring(legacyClassPathStart - xmlQuote.length(), legacyClassPathStart) == xmlQuote
                        && legacyClassPathEnd >= xmlQuote.length()
                        && text.substring(legacyClassPathEnd - xmlQuote.length(), legacyClassPathEnd) == xmlQuote
                if (!legacyClassPathQuoted) {
                    String beforeLegacyClassPath = text.substring(0, legacyClassPathStart)
                    String legacyClassPathArgument = text.substring(legacyClassPathStart, legacyClassPathEnd)
                    String afterLegacyClassPath = text.substring(legacyClassPathEnd)
                    text = beforeLegacyClassPath + xmlQuote + legacyClassPathArgument + xmlQuote + afterLegacyClassPath
                }
            }
            if (!text.contains('ATTR_EXCLUDE_TEST_CODE')) {
                text = text.replace('</launchConfiguration>',
                        '    <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\r\n' +
                        '</launchConfiguration>')
            }
            launch.setText(text, 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    dependsOn tasks.named('eclipseClasspath')
    dependsOn tasks.named('eclipseProject')
    dependsOn tasks.named('isolateEclipseProductionRuns')
    doLast {
        File classpath = file('.classpath')
        if (!classpath.isFile()) throw new GradleException('Eclipse .classpath was not generated')
        File eclipseProject = file('.project')
        if (!eclipseProject.isFile()
                || !eclipseProject.getText('UTF-8').contains("<name>${eclipseWorkspaceProjectName}</name>")) {
            throw new GradleException("Eclipse project is not named ${eclipseWorkspaceProjectName}")
        }
        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        String expectedJavaHome = (System.getenv('JAVA_HOME') ?: System.getProperty('java.home'))
                .replace('\\', '\\\\').replace(':', '\\:')
        if (!buildshipPreferences.isFile()
                || !buildshipPreferences.getText('UTF-8').contains("java.home=${expectedJavaHome}")
                || !buildshipPreferences.getText('UTF-8').contains('override.workspace.settings=true')) {
            throw new GradleException('Eclipse Buildship is not bound to the Gradle-compatible Java runtime')
        }
        String cp = classpath.getText('UTF-8')
        def classpathXml = new XmlSlurper(false, false).parse(classpath)
        def sourcePaths = classpathXml.classpathentry.findAll { it.@kind.text() == 'src' }
                .collect { it.@path.text() }
        String resourcesPath = processedMainResourcesPath()
        if (sourcePaths.contains('src/main/resources')
                || sourcePaths.contains('src/generated/resources')
                || !sourcePaths.contains(resourcesPath)) {
            throw new GradleException('Eclipse must use processed production resources, not raw src/main/resources')
        }
        String defaultOutput = classpathXml.classpathentry.find { it.@kind.text() == 'output' }?.@path?.text()
        Map<String, String> expectedOutputs = [
                'src/main/java': 'bin/main',
                (resourcesPath): 'bin/main',
                'src/test/java': 'bin/test',
                'src/test/resources': 'bin/test'
        ]
        def invalidOutputs = classpathXml.classpathentry.findAll { it.@kind.text() == 'src' }
                .collect { [it.@path.text(), it.@output.text()] }
                .findAll { pair -> expectedOutputs[pair[0]] != null && expectedOutputs[pair[0]] != pair[1] }
        boolean nestedOutput = classpathXml.classpathentry
                .findAll { it.@kind.text() == 'src' && !it.@output.text().isEmpty() }
                .any { entry -> entry.@output.text() == defaultOutput
                        || entry.@output.text().startsWith(defaultOutput + '/') }
        if (defaultOutput != 'bin/default' || !invalidOutputs.isEmpty() || nestedOutput
                || cp.contains('output="build/sourceSets')) {
            throw new GradleException("Eclipse outputs must be disjoint bin/default, bin/main and bin/test; " +
                    "default=${defaultOutput}, invalid=${invalidOutputs}")
        }
        classpathXml.classpathentry.each { entry ->
            String path = entry.@path.text()
            boolean testSource = path.replace('\\', '/').startsWith('src/test/')
            boolean testLibrary = path ==~ /(?i).*\/(junit|hamcrest|mockito|byte-buddy)[^\/]*\/.*\.jar/
            if (testSource) {
                String scope = entry.attributes.attribute.find { it.@name.text() == 'gradle_scope' }?.@value?.text()
                if (entry.@output.text() != 'bin/test' || scope != 'test') {
                    throw new GradleException("Eclipse test source is not isolated: ${path}")
                }
            }
            if (testLibrary) {
                String scope = entry.attributes.attribute.find { it.@name.text() == 'gradle_used_by_scope' }?.@value?.text()
                if (scope != 'test') {
                    throw new GradleException("Eclipse production classpath exposes test dependency: ${path}")
                }
            }
        }
        Set<String> eclipseMixinExtras = configurations.compileClasspath.resolvedConfiguration
                .resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'io.github.llamalad7'
                        && it.name.startsWith('mixinextras-') }
                .collect { "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}" }
                .toSet()
        if (eclipseMixinExtras.any { it.startsWith('io.github.llamalad7:mixinextras-common:') }) {
            throw new GradleException(
                    "Eclipse production classpath contains duplicate MixinExtras common module: ${eclipseMixinExtras}")
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            String launch = file(name).getText('UTF-8')
            if (!launch.contains('ATTR_EXCLUDE_TEST_CODE') || launch =~ /(?i)(junit|mockito|src\/test)/) {
                throw new GradleException("Eclipse launch is not production-only: ${name}")
            }
            if (!launch.contains("key=\"org.eclipse.jdt.launching.PROJECT_ATTR\" value=\"${eclipseWorkspaceProjectName}\"")) {
                throw new GradleException("Eclipse launch targets the wrong workspace project: ${name}")
            }
            String mainOutput = new File(projectDir, 'bin/main').absolutePath
            String expectedModClasses = "mineralogy%%${mainOutput}"
            if (!launch.contains(expectedModClasses)) {
                throw new GradleException("Eclipse launch is not using Forge 65's merged production output: ${name}")
            }
            ['cache', 'metadata'].each { flag ->
                if (!launch.contains("--${flag} &quot;")) {
                    throw new GradleException("Eclipse launch does not quote its --${flag} path: ${name}")
                }
            }
            ['to-srg', 'to-obf'].each { flag ->
                if (launch.contains("--${flag} ") && !launch.contains("--${flag} &quot;")) {
                    throw new GradleException("Eclipse launch does not quote its optional --${flag} path: ${name}")
                }
            }
            if (launch.contains('-DlegacyClassPath.file=')
                    && (!launch.contains('&quot;-DlegacyClassPath.file=')
                    || !launch.contains('minecraft_classpath.txt&quot; -DignoreList='))) {
                throw new GradleException("Eclipse launch does not quote -DlegacyClassPath.file: ${name}")
            }
            if (launch.contains('value=""') || launch.contains('${MC_VERSION}')
                    || launch.contains('${') || launch.contains('src/test')
                    || launch.contains('bin/test')) {
                throw new GradleException("Eclipse launch contains an unresolved, empty, or test-only value: ${name}")
            }
        }
        ['README.md', 'PLAYER_GUIDE.md', 'DEVELOPER_GUIDE.md', 'CONTENT_CONFIG.md',
         'PROVIDER.md', 'VERSIONS.md', 'examples/mineralogy-provider.json'].each { name ->
            File guide = new File(projectDir, "bin/main/META-INF/mineralogy/docs/${name}")
            if (!guide.isFile()) {
                throw new GradleException("Eclipse output is missing bundled documentation: ${name}")
            }
        }
        File processedResources = processedMainResourcesDirectory()
        File processedProvider = new File(processedResources,
                'data/mineralogy/orespawn/provider.json')
        File eclipseProvider = new File(projectDir,
                'bin/main/data/mineralogy/orespawn/provider.json')
        if (!eclipseProvider.isFile()
                || !java.util.Arrays.equals(eclipseProvider.getBytes(), processedProvider.getBytes())) {
            throw new GradleException('Eclipse output contains stale processed production resources')
        }
        File processedModsToml = new File(processedResources, 'META-INF/mods.toml')
        File eclipseModsToml = new File(projectDir, 'bin/main/META-INF/mods.toml')
        if (!processedModsToml.isFile() || !eclipseModsToml.isFile()
                || !java.util.Arrays.equals(eclipseModsToml.getBytes(), processedModsToml.getBytes())) {
            throw new GradleException('Eclipse output contains stale or unexpanded mods.toml metadata')
        }
        String eclipseMetadata = eclipseModsToml.getText('UTF-8')
        if (eclipseMetadata.contains('${') || !eclipseMetadata.contains('version="6.1.2.2602001"')) {
            throw new GradleException('Eclipse output contains unresolved or invalid Mineralogy version metadata')
        }
    }
}

tasks.matching { it.name == 'genEclipseRuns' }.configureEach {
    finalizedBy tasks.named('syncForge65EclipseLaunches')
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('syncForge65EclipseLaunches')
}

tasks.named('check') {
    dependsOn tasks.named('verifyJava25Toolchain')
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('verifyMavenCoordinates')
    dependsOn tasks.named('verifyOilCompatibilityFixtureIsolation')
    dependsOn tasks.named('compileRecipeIntegrationFixture')
}
