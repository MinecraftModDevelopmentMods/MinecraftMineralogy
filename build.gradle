        [tasks.named('jar', Jar).get().archiveFile.get().asFile,
         tasks.named('sourcesJar', Jar).get().archiveFile.get().asFile,
         tasks.named('javadocJar', Jar).get().archiveFile.get().asFile].each { File artifact ->
            if (!artifact.isFile()) return
            new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                if (zip.entries().toList().any { entry ->
                    entry.name.contains('oilcompatprobe') || entry.name.contains('oilCompatibilityTest') ||
                            entry.name.contains('recipeintegrationprobe') ||
                            entry.name.contains('recipeIntegrationTest') ||
                            entry.name.startsWith('zone/moddev/mc/mineralogy/fixture/') ||
                            entry.name.startsWith('zone/moddev/mc/mineralogy/oilfixture/')
                }) {
                    throw new GradleException("A packaged-runtime fixture leaked into ${artifact.name}")
                }
            }
        }
    }
}

