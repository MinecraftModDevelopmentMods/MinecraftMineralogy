dependencies {
    implementation(minecraft.dependency("net.minecraftforge:forge:${project.mc_version}-${project.forge_version}")) {
        // Forge 65 exposes mixinextras-common only for compilation and embeds
        // the complete MixinExtras runtime in mixinextras-forge. Buildship
        // otherwise places both jars on an Eclipse launch module path, where
        // their shared packages fail Java 25 module resolution before Forge
        // starts. Mineralogy uses Sponge Mixin only, so the common annotation
        // artifact is unnecessary here.
        exclude group: 'io.github.llamalad7', module: 'mixinextras-common'
    }
    // Forge 65 uses official names in both development and production, so the
    // exact released OreSpawn artifact is suitable for ordinary runtime use.
    runtimeOnly "curse.maven:mmd-orespawn-${project.orespawn_curse_project_id}:${project.orespawn_curse_file_id}"
    orespawnRelease "curse.maven:mmd-orespawn-${project.orespawn_curse_project_id}:${project.orespawn_curse_file_id}"
