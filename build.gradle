import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile
import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'Mineralogy'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}

def minecraftVersionParts = project.mc_version.toString().tokenize('.')
if (minecraftVersionParts.size() < 2 || minecraftVersionParts.size() > 3
        || !minecraftVersionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mc_version must use major.minor or major.minor.patch numeric form: ${project.mc_version}")
}
def minecraftPatch = minecraftVersionParts.size() == 3 ? minecraftVersionParts[2] : '0'
def expectedTargetVersion = "${minecraftVersionParts[0]}" \
        + "${minecraftVersionParts[1].padLeft(2, '0')}" \
        + "${minecraftPatch.padLeft(2, '0')}" \
        + '1'
if (versionParts[3] != expectedTargetVersion) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.mc_version} Forge target ${expectedTargetVersion}")
}

ext.functional_version = versionParts[0..2].join('.')
ext.display_version = project.mod_version
ext.release_tag = project.mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.withType(Test).configureEach {
    workingDir = project.projectDir
}

tasks.named('compileTestJava', JavaCompile) {
    options.compilerArgs.add('-proc:none')
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextSuffixes = [
        '.cfg', '.css', '.html', '.info', '.java', '.js', '.json', '.lang',
        '.mcmeta', '.md', '.properties', '.txt', '.xml'
]
def archiveTextPatterns = archiveTextSuffixes.collect { "**/*${it}".toString() }
archiveTextPatterns.addAll(['**/element-list', '**/package-list'])
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version
    // Forge applies OreSpawn's SRG FMLAT in an ordinary packaged installation,
    // but ForgeGradle 7 does not remap a dependency transform for mapped
    // development Minecraft. Mirror the exact two released rules for
    // Gradle/Eclipse only. This file is outside main resources and is never
    // packaged by Mineralogy.
    accessTransformer.from(file('gradle/orespawn-development-access-transformer.cfg'))
    String configuredRunDirectory = providers.gradleProperty('mineralogyRunDirectory').getOrElse('run')

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(configuredRunDirectory)
            systemProperty 'forge.logging.console.level', 'debug'
        }

        register('client') {
            if (project.hasProperty('mc_username')) {
                args '--username', project.mc_username
            }
            if (project.hasProperty('mc_uuid')) {
                args '--uuid', project.mc_uuid
            }
        }

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    // Optional exact-coordinate mirror populated by CI from the official
    // CurseForge file endpoint, avoiding transient CurseMaven throttling.
    if (providers.gradleProperty('orespawnVerificationRepository').isPresent()) {
        maven {
            name = 'OreSpawnReleaseVerificationMirror'
            url = uri(providers.gradleProperty('orespawnVerificationRepository').get())
            metadataSources { artifact() }
            content { includeGroup('curse.maven') }
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    mavenCentral()
    mavenLocal()

    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
    if (!providers.gradleProperty('orespawnVerificationRepository').isPresent()) {
        maven {
            name = 'CurseMaven'
            url = 'https://www.cursemaven.com'
            metadataSources { artifact() }
            content { includeGroup('curse.maven') }
        }
    }
    maven {
        name = 'ModDevZone'
        url = 'https://maven.moddev.zone/'
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.mc_version}-${project.forge_version}")

    // The legacy Mavenizer metadata exposes lwjgl_util at runtime only even
    // though Minecraft 1.10.2 exposes its types to compiling mods.
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'

    // Mineralogy has no compile-time OreSpawn API calls, but every development
    // and production runtime requires this exact released matching build.
    runtimeOnly "curse.maven:mmd-orespawn-${project.orespawn_curse_project_id}:${project.orespawn_curse_file_id}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:2.28.2'
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('mcversion', project.mc_version)

    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: project.mc_version
    }

    from('docs') {
        into 'META-INF/mineralogy/docs'
    }

    rename '(.+_at.cfg)', 'META-INF/$1'

    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    description = 'Copies Gradle-processed production resources into Eclipse merged output.'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Built-On-Java'         : '8',
                'Built-On'              : "${project.mc_version}-${project.forge_version}"
        ])
    }
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
}

tasks.named('sourcesJar', Jar) {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:sources",
                'Implementation-Title'  : "${base.archivesName.get()}-sources",
                'Implementation-Version': project.version
        ])
    }
}

tasks.named('javadocJar', Jar) {
    filteringCharset = 'UTF-8'
    archiveClassifier = 'javadoc'
    filesMatching('**/*.html') {
        filter { line ->
            line.replaceFirst(/^ +(?=[^<].*&nbsp;.*(?:,|\)<\/pre>)$)/, '    ')
        }
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
    manifest {
        attributes([
                'Maven-Artifact'        : "${project.group}:${base.archivesName.get()}:${project.version}:javadoc",
                'Implementation-Title'  : "${base.archivesName.get()}-javadoc",
                'Implementation-Version': project.version
        ])
    }
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) {
        artifacts.clear()
    }
    artifacts {
        add(configurationName, releaseJar)
    }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

def expectedReleaseFiles = providers.provider {
    def prefix = "${base.archivesName.get()}-${project.version}"
    [
            "${prefix}.jar",
            "${prefix}-sources.jar",
            "${prefix}-javadoc.jar"
    ]
}
def preparedReleaseDir = providers.gradleProperty('preparedReleaseDir')

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Validates versions and all four OreSpawn dependency declarations before release.'

    doLast {
        if (project.mod_version != '6.0.1.110021') {
            throw new GradleException("Unexpected Mineralogy release version: ${project.mod_version}")
        }
        if (project.mc_version != '1.10.2' || project.forge_version != '12.18.3.2511') {
            throw new GradleException('Unexpected Minecraft or Forge target')
        }
        if (project.minecraft_version != project.mc_version
                || project.loader_name != 'forge'
                || project.loader_code != '1'
                || project.java_version != '8'
                || project.java_toolchain_version != '8.0.502+7'
                || project.gradle_java_version != '17'
                || project.curseforge_project_id != project.cf_project_id) {
            throw new GradleException('Unexpected generic release dispatcher metadata')
        }
        if (project.orespawn_version != '4.0.6.110021'
                || project.orespawn_curse_project_id != '245586'
                || project.orespawn_curse_file_id != '8681675'
                || project.orespawn_sha256 != '9FD6F2D6C5513A45C2B1CBE62F352A4F804FC7EE3EE30C44A6E5266BBF813E6D') {
            throw new GradleException('Unexpected released OreSpawn dependency')
        }
        if (project.cf_project_id != '240974'
                || project.cf_requirements != 'mmd-orespawn'
                || project.cf_versions != '1.10.2') {
            throw new GradleException('Unexpected CurseForge release configuration')
        }

        String source = file('src/main/java/zone/moddev/mc/mineralogy/Mineralogy.java').getText('UTF-8')
        String metadata = file('src/main/resources/mcmod.info').getText('UTF-8')
        if (!source.contains('required-after:orespawn@[4.0.6,5.0.0)')) {
            throw new GradleException('Forge metadata no longer requires OreSpawn [4.0.6,5.0.0)')
        }
        if (!metadata.contains('"orespawn@[4.0.6,5.0.0)"')) {
            throw new GradleException('mcmod.info no longer requires OreSpawn [4.0.6,5.0.0)')
        }
    }
}

tasks.register('verifyReleaseDependencies') {
    group = 'verification'
    description = 'Resolves and audits the exact Forge and released OreSpawn runtime dependencies.'
    dependsOn tasks.named('verifyReleaseConfiguration')

    doLast {
        def runtimeClasspath = configurations.runtimeClasspath
        def artifacts = runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        def declaredCoordinates = runtimeClasspath.allDependencies.collect { dependency ->
            "${dependency.group}:${dependency.name}:${dependency.version}".toString()
        }
        String expectedForge = "net.minecraftforge:forge:${project.mc_version}-${project.forge_version}".toString()
        String expectedOreSpawn = "curse.maven:mmd-orespawn-${project.orespawn_curse_project_id}:${project.orespawn_curse_file_id}".toString()
        if (!declaredCoordinates.contains(expectedForge)) {
            throw new GradleException("Runtime classpath is missing ${expectedForge}; declared ${declaredCoordinates}")
        }

        def oreSpawnArtifacts = artifacts.findAll { artifact ->
            def id = artifact.moduleVersion.id
            id.group == 'curse.maven' && id.name.startsWith('mmd-orespawn-')
        }
        if (oreSpawnArtifacts.size() != 1
                || "${oreSpawnArtifacts.first().moduleVersion.id.group}:"
                + "${oreSpawnArtifacts.first().moduleVersion.id.name}:"
                + "${oreSpawnArtifacts.first().moduleVersion.id.version}" != expectedOreSpawn) {
            throw new GradleException("Expected exactly ${expectedOreSpawn}, found "
                    + oreSpawnArtifacts.collect { it.moduleVersion.id })
        }

        String actualOreSpawnSha256 = MessageDigest.getInstance('SHA-256')
                .digest(oreSpawnArtifacts.first().file.bytes).encodeHex().toString().toUpperCase()
        if (actualOreSpawnSha256 != project.orespawn_sha256) {
            throw new GradleException("Released OreSpawn SHA-256 is ${actualOreSpawnSha256}, expected "
                    + project.orespawn_sha256)
        }

        ZipFile oreSpawn = new ZipFile(oreSpawnArtifacts.first().file)
        try {
            def metadataEntry = oreSpawn.getEntry('mcmod.info')
            if (metadataEntry == null) {
                throw new GradleException('Resolved OreSpawn jar is missing mcmod.info')
            }
            def metadata = new JsonSlurper().parseText(
                    oreSpawn.getInputStream(metadataEntry).getText(StandardCharsets.UTF_8.name()))
            def mod = metadata instanceof List ? metadata.find { it.modid == 'orespawn' } : metadata
            if (mod == null || mod.modid != 'orespawn' || mod.version != project.orespawn_version) {
                throw new GradleException('Resolved OreSpawn file does not contain version '
                        + project.orespawn_version)
            }

            def transformerEntry = oreSpawn.getEntry('META-INF/accesstransformer.cfg')
            if (transformerEntry == null) {
                throw new GradleException('Resolved OreSpawn file is missing its access transformer')
            }
            List<String> releasedTransformer = oreSpawn.getInputStream(transformerEntry)
                    .getText(StandardCharsets.UTF_8.name()).readLines()
                    .findAll { !it.trim().isEmpty() }
            List<String> expectedReleasedTransformer = [
                    'public-f net.minecraft.world.WorldProvider field_76578_c # biomeProvider',
                    'public-f net.minecraft.world.gen.ChunkProviderOverworld field_186001_t # oceanBlock'
            ]
            List<String> developmentTransformer = file(
                    'gradle/orespawn-development-access-transformer.cfg').readLines('UTF-8')
                    .findAll { !it.trim().isEmpty() }
            List<String> expectedDevelopmentTransformer = [
                    'public-f net.minecraft.world.WorldProvider biomeProvider',
                    'public-f net.minecraft.world.gen.ChunkProviderOverworld oceanBlock'
            ]
            if (releasedTransformer != expectedReleasedTransformer
                    || developmentTransformer != expectedDevelopmentTransformer) {
                throw new GradleException('Development access transformer no longer matches released OreSpawn semantics')
            }
        } finally {
            oreSpawn.close()
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the exact three distributable jars and their release-critical contents.'
    dependsOn tasks.named('verifyReleaseDependencies')
    dependsOn tasks.named('assemble')

    doLast {
        File libs = layout.buildDirectory.dir('libs').get().asFile
        List<File> jars = (libs.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }
                .sort { it.name }
        List<String> actual = jars.collect { it.name }
        List<String> expected = expectedReleaseFiles.get().sort()
        if (actual != expected) {
            throw new GradleException("Expected exactly ${expected}, found ${actual}")
        }

        jars.each { candidate ->
            if (candidate.length() == 0L) {
                throw new GradleException("Empty release artifact: ${candidate.name}")
            }

            ZipFile candidateZip = new ZipFile(candidate)
            try {
                candidateZip.entries().findAll { entry ->
                    !entry.isDirectory()
                            && (archiveTextSuffixes.any { entry.name.endsWith(it) }
                            || entry.name.endsWith('/element-list')
                            || entry.name.endsWith('/package-list'))
                }.each { entry ->
                    boolean containsCarriageReturn = candidateZip.getInputStream(entry).withCloseable { input ->
                        input.bytes.any { value -> value == 13 }
                    }
                    if (containsCarriageReturn) {
                        throw new GradleException(
                                "${candidate.name}!/${entry.name} does not use canonical LF line endings")
                    }
                }
            } finally {
                candidateZip.close()
            }
        }

        File mainJar = new File(libs, expectedReleaseFiles.get().first())
        ZipFile zip = new ZipFile(mainJar)
        try {
            List<String> names = zip.entries().collect { it.name }
            ['mcmod.info', 'assets/mineralogy/orespawn/provider.json',
             'META-INF/mineralogy/docs/VERSIONS.md'].each { required ->
                if (!names.contains(required)) {
                    throw new GradleException("Release jar is missing ${required}")
                }
            }
            ['agent-notes/', 'src/test/', 'OilRuntimeProbe', 'org/junit/',
             'org/mockito/', 'net/bytebuddy/',
             'orespawn-development-access-transformer.cfg',
             'META-INF/accesstransformer.cfg'].each { forbidden ->
                if (names.any { it.contains(forbidden) }) {
                    throw new GradleException("Release jar contains forbidden entry matching ${forbidden}")
                }
            }

            String metadata = zip.getInputStream(zip.getEntry('mcmod.info'))
                    .getText(StandardCharsets.UTF_8.name())
            def parsed = new JsonSlurper().parseText(metadata)
            def mod = parsed instanceof List ? parsed.first() : parsed
            if (mod.version != project.mod_version
                    || mod.mcversion != project.mc_version
                    || mod.dependencies != ['orespawn@[4.0.6,5.0.0)']) {
                throw new GradleException('Packaged mcmod.info version or OreSpawn dependency is incorrect')
            }

            zip.entries().findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] header = new byte[8]
                zip.getInputStream(entry).withCloseable { input ->
                    if (input.read(header) != header.length) {
                        throw new GradleException("Cannot inspect bytecode header for ${entry.name}")
                    }
                }
                int major = ((header[6] & 0xff) << 8) | (header[7] & 0xff)
                if (major != 52) {
                    throw new GradleException("${entry.name} uses Java class major ${major}, expected 52")
                }
            }

            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            def manifest = manifestEntry == null ? null
                    : new Manifest(zip.getInputStream(manifestEntry)).mainAttributes
            if (manifest == null
                    || manifest.getValue('Implementation-Version') != project.mod_version
                    || manifest.getValue('Timestamp') != null) {
                throw new GradleException('Release manifest version is incorrect or contains a volatile timestamp')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('writeReleaseChecksums') {
    group = 'verification'
    description = 'Writes SHA-256 checksums for the audited release jars.'
    dependsOn tasks.named('verifyReleaseArtifacts')
    def outputFile = layout.buildDirectory.file('release/SHA256SUMS')
    outputs.file(outputFile)

    doLast {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        File libs = layout.buildDirectory.dir('libs').get().asFile
        String contents = expectedReleaseFiles.get().sort().collect { name ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            new File(libs, name).withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${name}"
        }.join(System.lineSeparator()) + System.lineSeparator()
        output.setText(contents, 'UTF-8')
    }
}

tasks.register('verifyPreparedReleaseArtifacts') {
    group = 'verification'
    description = 'Audits a previously built immutable release bundle before remote Maven publication.'

    doLast {
        if (!preparedReleaseDir.isPresent()) {
            throw new GradleException('preparedReleaseDir is required for prepared artifact publication')
        }

        File prepared = file(preparedReleaseDir.get())
        if (!prepared.isDirectory()) {
            throw new GradleException("Prepared release directory does not exist: ${prepared}")
        }

        List<String> expected = expectedReleaseFiles.get().sort()
        List<File> jars = (prepared.listFiles() ?: [] as File[])
                .findAll { it.name.endsWith('.jar') }
                .sort { it.name }
        if (jars.collect { it.name } != expected || jars.any { it.length() == 0L }) {
            throw new GradleException("Prepared release must contain exactly the non-empty jars ${expected}")
        }

        File checksums = new File(prepared, 'SHA256SUMS')
        File changelog = new File(prepared, 'CHANGELOG.txt')
        if (!checksums.isFile() || !changelog.isFile()) {
            throw new GradleException('Prepared release is missing SHA256SUMS or CHANGELOG.txt')
        }

        List<String> actualChecksums = jars.collect { candidate ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            candidate.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                    if (read > 0) digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex().toString().toUpperCase()}  ${candidate.name}"
        }.sort()
        List<String> declaredChecksums = checksums.readLines('UTF-8')
                .findAll { !it.trim().isEmpty() }
                .sort()
        if (actualChecksums != declaredChecksums) {
            throw new GradleException('Prepared release checksums do not match the immutable jars')
        }
    }
}

def mavenUploadUrl = providers.environmentVariable('MAVEN_UPLOAD_URL')
        .orElse('https://invalid.invalid/missing-maven-upload-url')
def mavenUploadUsername = providers.environmentVariable('MAVEN_UPLOAD_USERNAME')
def mavenUploadPassword = providers.environmentVariable('MAVEN_UPLOAD_PASSWORD')

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group.toString()
            artifactId = base.archivesName.get()
            version = project.version.toString()
            if (preparedReleaseDir.isPresent()) {
                File prepared = file(preparedReleaseDir.get())
                artifact(new File(prepared, expectedReleaseFiles.get()[0]))
                artifact(new File(prepared, expectedReleaseFiles.get()[1])) {
                    classifier = 'sources'
                }
                artifact(new File(prepared, expectedReleaseFiles.get()[2])) {
                    classifier = 'javadoc'
                }
            } else {
                artifact(releaseJar)
                artifact(tasks.named('sourcesJar'))
                artifact(tasks.named('javadocJar'))
            }
            pom {
                name = 'Minecraft Mineralogy'
                description = 'Geologically themed rocks, minerals, building blocks, and OreSpawn provider data.'
                url = 'https://github.com/MinecraftModDevelopmentMods/MinecraftMineralogy'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/MinecraftModDevelopmentMods/MinecraftMineralogy.git'
                    developerConnection = 'scm:git:ssh://git@github.com/MinecraftModDevelopmentMods/MinecraftMineralogy.git'
                    url = 'https://github.com/MinecraftModDevelopmentMods/MinecraftMineralogy'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'release'
            url = uri(mavenUploadUrl.get())
            credentials {
                username = mavenUploadUsername.orNull ?: ''
                password = mavenUploadPassword.orNull ?: ''
            }
        }
    }
}

tasks.register('validateMavenReleaseCredentials') {
    group = 'publishing'
    description = 'Prevents Maven publication from silently targeting a local or incomplete repository.'
    doLast {
        if (!providers.environmentVariable('MAVEN_UPLOAD_URL').isPresent()
                || !mavenUploadUsername.isPresent()
                || !mavenUploadPassword.isPresent()) {
            throw new GradleException('MAVEN_UPLOAD_URL, MAVEN_UPLOAD_USERNAME, and MAVEN_UPLOAD_PASSWORD are required')
        }
        if (providers.environmentVariable('MAVEN_UPLOAD_URL').get().startsWith('file:')) {
            throw new GradleException('Maven release publication must use a remote repository')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('validateMavenReleaseCredentials')
    if (preparedReleaseDir.isPresent()) {
        dependsOn tasks.named('verifyPreparedReleaseArtifacts')
    } else {
        dependsOn tasks.named('verifyReleaseArtifacts')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
    synchronizationTasks 'genEclipseRuns'
}

def configureEclipseBuildship = tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Creates the Buildship project configuration required by ForgeGradle Eclipse launches.'

    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        if (preferencesFile.isFile()) {
            preferencesFile.withInputStream { preferences.load(it) }
        }

        Map<String, String> requiredPreferences = [
                'eclipse.preferences.version'     : '1',
                'connection.gradle.distribution' : 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'    : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'         : '',
                'gradle.user.home'                : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'    : 'true'
        ]
        if (!preferencesFile.isFile() || requiredPreferences.any { key, value ->
            preferences.getProperty(key) != value
        }) {
            requiredPreferences.each { key, value -> preferences.setProperty(key, value) }
            preferencesFile.parentFile.mkdirs()
            preferencesFile.withOutputStream {
                preferences.store(it,
                        'Generated by configureEclipseBuildship; keep Eclipse and command-line caches aligned.')
            }
        }
    }
}

tasks.named('genEclipseRuns') {
    finalizedBy configureEclipseBuildship, 'isolateEclipseProductionRuns'
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies that ordinary generated Eclipse launches exclude test code and dependencies.'
    dependsOn tasks.named('genEclipseRuns')

    doLast {
        File buildshipPreferences = file('.settings/org.eclipse.buildship.core.prefs')
        if (!buildshipPreferences.isFile()) {
            throw new GradleException("Missing Eclipse Buildship project configuration: ${buildshipPreferences}")
        }
        Properties buildship = new Properties()
        buildshipPreferences.withInputStream { buildship.load(it) }
        if (buildship.getProperty('eclipse.preferences.version') != '1'
                || buildship.getProperty('connection.gradle.distribution') != 'GRADLE_DISTRIBUTION(WRAPPER)') {
            throw new GradleException('Eclipse Buildship project configuration does not use the Gradle wrapper')
        }
        String configuredGradleHome = buildship.getProperty('connection.gradle.user.home', '').trim()
        if (!configuredGradleHome
                || file(configuredGradleHome).canonicalFile != gradle.gradleUserHomeDir.canonicalFile) {
            throw new GradleException("Eclipse Buildship Gradle home is not ${gradle.gradleUserHomeDir.canonicalPath}")
        }
        String projectMetadata = file('.project').getText('UTF-8')
        if (!projectMetadata.contains('org.eclipse.buildship.core.gradleprojectnature')
                || !projectMetadata.contains('org.eclipse.buildship.core.gradleprojectbuilder')) {
            throw new GradleException('Eclipse project metadata is missing its Buildship nature or builder')
        }

        File eclipseModMetadata = file('bin/main/mcmod.info')
        if (!eclipseModMetadata.isFile()) {
            throw new GradleException('Eclipse output is missing processed mcmod.info')
        }
        def eclipseMetadata = new JsonSlurper().parseText(eclipseModMetadata.getText('UTF-8'))
        def eclipseMod = eclipseMetadata instanceof List ? eclipseMetadata.first() : eclipseMetadata
        if (eclipseMod.version != project.mod_version || eclipseMod.mcversion != project.mc_version) {
            throw new GradleException('Eclipse output contains unexpanded or incorrect mod metadata')
        }
        ['README.md', 'PLAYER_GUIDE.md', 'DEVELOPER_GUIDE.md',
         'CONTENT_CONFIG.md', 'PROVIDER.md', 'VERSIONS.md'].each { guide ->
            if (!file("bin/main/META-INF/mineralogy/docs/${guide}").isFile()) {
                throw new GradleException("Eclipse output is missing bundled guide ${guide}")
            }
        }

        ['MinecraftMineralogy_Client.launch', 'MinecraftMineralogy_Server.launch'].each { name ->
            if (file(name).exists()) {
                throw new GradleException("Obsolete ForgeGradle 2 Eclipse launch still exists: ${name}")
            }
        }

        List<File> launchFiles = fileTree(project.projectDir) {
            include '*.launch'
            include '.eclipse/*.launch'
        }.files.findAll { file ->
            ['runClient.launch', 'runServer.launch',
             'runTestClient.launch', 'runTestServer.launch'].contains(file.name)
        } as List<File>
        if (launchFiles.size() != 4) {
            throw new GradleException("ForgeGradle generated ${launchFiles.size()} of 4 expected Eclipse launch files")
        }

        List<String> forbidden = [
                'src/test', 'bin/test', 'build/classes/java/test',
                'junit-', 'mockito-', 'byte-buddy', 'objenesis', 'OilRuntimeProbe'
        ]
        launchFiles.findAll { launch ->
            ['runClient.launch', 'runServer.launch'].contains(launch.name)
        }.each { launch ->
            String contents = launch.getText('UTF-8').replace('\\', '/')
            List<String> present = forbidden.findAll { contents.contains(it) }
            if (!present.isEmpty()) {
                throw new GradleException("${launch.name} exposes test code/dependencies: ${present}")
            }
            if (!contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')
                    || !contents.contains('value="true"')) {
                throw new GradleException("${launch.name} does not exclude test code from its Buildship classpath")
            }
            if (!contents.contains('PROJECT_ATTR" value="MinecraftMineralogy"')) {
                throw new GradleException("${launch.name} targets the wrong Eclipse project")
            }
        }
        launchFiles.each { launch ->
            String contents = launch.getText('UTF-8')
            ['--cache', '--metadata', '--to-srg', '--to-obf'].each { option ->
                String prefix = option + ' '
                int valueStart = contents.indexOf(prefix)
                if (valueStart < 0) {
                    throw new GradleException("${launch.name} is missing Slime Launcher argument ${option}")
                }
                valueStart += prefix.length()
                int valueEnd = contents.indexOf(' --', valueStart)
                if (valueEnd < 0) {
                    throw new GradleException("${launch.name} has a malformed Slime Launcher argument ${option}")
                }
                String value = contents.substring(valueStart, valueEnd)
                boolean quoted = value.startsWith('&quot;') && value.endsWith('&quot;')
                if (value.find(/\s/) != null && !quoted) {
                    throw new GradleException("${launch.name} leaves whitespace unquoted in ${option}: ${value}")
                }
            }
        }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Normalizes ordinary ForgeGradle Eclipse launches for production-only execution.'
    dependsOn prepareEclipseResources
    doLast {
        [
                'MinecraftMineralogy_Client.launch': 'MAIN_TYPE" value="GradleStart"',
                'MinecraftMineralogy_Server.launch': 'MAIN_TYPE" value="GradleStartServer"'
        ].each { name, legacyMarker ->
            File legacy = file(name)
            if (legacy.isFile() && legacy.getText('UTF-8').contains(legacyMarker)) {
                if (!legacy.delete()) {
                    throw new GradleException("Could not retire obsolete ForgeGradle 2 launch ${name}")
                }
            }
        }

        ['runClient.launch', 'runServer.launch',
         'runTestClient.launch', 'runTestServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) {
                throw new GradleException("ForgeGradle did not generate ${name}")
            }
            String contents = launch.getText('UTF-8')
            boolean changed = false
            boolean production = ['runClient.launch', 'runServer.launch'].contains(name)
            if (production && !contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                String marker = '</launchConfiguration>'
                String attribute = '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>'
                contents = contents.replace(marker, attribute + System.lineSeparator() + marker)
                changed = true
            }
            ['--cache', '--metadata', '--to-srg', '--to-obf'].each { option ->
                String prefix = option + ' '
                int valueStart = contents.indexOf(prefix)
                if (valueStart < 0) {
                    throw new GradleException("${name} is missing Slime Launcher argument ${option}")
                }
                valueStart += prefix.length()
                int valueEnd = contents.indexOf(' --', valueStart)
                if (valueEnd < 0) {
                    throw new GradleException("${name} has a malformed Slime Launcher argument ${option}")
                }
                String value = contents.substring(valueStart, valueEnd)
                if (value.find(/\s/) != null && !value.startsWith('&quot;')) {
                    contents = (contents.substring(0, valueStart)
                            + '&quot;' + value + '&quot;'
                            + contents.substring(valueEnd))
                    changed = true
                }
            }
            if (changed) {
                launch.setText(contents, 'UTF-8')
            }
        }
    }
}
