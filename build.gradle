def orespawnMavenGroup = 'zone.moddev.mc.orespawn'
def orespawnMavenArtifact = 'OreSpawn'
def orespawnCoordinate = "${orespawnMavenGroup}:${orespawnMavenArtifact}:${project.orespawn_version}"
def orespawnCurseModule = "mmd-orespawn-${project.orespawn_curse_project_id}"
def orespawnVerificationRepository = project.findProperty('orespawnVerificationRepository')
def orespawnMmdRepository = project.findProperty('orespawnMmdRepository')
        ?: 'https://maven.moddev.zone/releases'
def orespawnCurseRepository = project.findProperty('orespawnCurseRepository')
        ?: 'https://www.cursemaven.com'
repositories {
    mavenCentral()

    // Prefer MMD's Maven publication. Gradle treats HTTP 429 as fatal rather
    // than trying the next repository, so CurseMaven cannot be the primary if
    // it is to serve as a useful fallback. CI may prepend its sealed local
    // mirror while retaining the same published Maven coordinate.
    def orespawnRepositories = []
    if (orespawnVerificationRepository != null) {
        orespawnRepositories.add(ivy {
            name = 'OreSpawnReleaseVerificationMirror'
            url = uri(orespawnVerificationRepository)
            patternLayout {
                artifact "curse/maven/${orespawnCurseModule}/${project.orespawn_curse_file_id}/${orespawnCurseModule}-${project.orespawn_curse_file_id}.[ext]"
            }
            metadataSources { artifact() }
        })
    }
    orespawnRepositories.add(maven {
        name = 'MMDMaven'
        url = uri(orespawnMmdRepository)
        metadataSources {
            mavenPom()
            artifact()
        }
    })
    orespawnRepositories.add(ivy {
        name = 'CurseMavenOreSpawnFallback'
        url = uri(orespawnCurseRepository)
        patternLayout {
            artifact "curse/maven/${orespawnCurseModule}/${project.orespawn_curse_file_id}/${orespawnCurseModule}-${project.orespawn_curse_file_id}.[ext]"
        }
        metadataSources { artifact() }
    })

    // Prevent this module from falling through to unrelated plugin or public
    // repositories; only the sealed mirror and the two audited release hosts
    // may provide it.
    exclusiveContent {
        forRepositories(orespawnRepositories as org.gradle.api.artifacts.repositories.ArtifactRepository[])
        filter {
            includeModule(orespawnMavenGroup, orespawnMavenArtifact)
        }
    }
}

