def probeClasses = layout.buildDirectory.dir('terrain-compatibility-fixture/classes')
tasks.register('compileTerrainCompatibilityProbe', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/terrainCompatibilityTest/java')
    classpath = files(sourceSets.main.output, sourceSets.main.compileClasspath)
    destinationDirectory = probeClasses
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
        vendor = JvmVendorSpec.ADOPTIUM
    }
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
}
tasks.register('terrainCompatibilityProbeJar', Jar) {
    dependsOn tasks.named('compileTerrainCompatibilityProbe'), tasks.named('generateTerrainCompatibilityReflectionMap')
    archiveFileName = 'terraincompatibilityprobe.jar'
    destinationDirectory = layout.buildDirectory.dir('terrain-compatibility-fixture')
    from probeClasses
    from 'src/terrainCompatibilityTest/resources'
    from layout.buildDirectory.dir('terrain-compatibility-fixture/reflection')
}

// The production loader uses SRG members. Reflection strings are not bytecode
// references, so seal their aliases from this exact target's official mappings.
tasks.register('generateTerrainCompatibilityReflectionMap') {
    inputs.file(minecraft.dependency.toSrgFile)
    def destination = layout.buildDirectory.file('terrain-compatibility-fixture/reflection/terrain-reflection.properties')
    outputs.file(destination)
    doLast {
        def selected = ['getListener', 'getSculkSpreader', 'getCursors', 'die', 'of',
                'handleGameEvent', 'updateCursors', 'registryOrThrow', 'getHolderOrThrow',
                'value', 'place', 'listener', 'callback', 'ZOMBIE', 'ENTITY_DIE'].toSet()
        def aliases = new TreeMap<String, Set<String>>()
        String owner = null
        def mapping = inputs.files.singleFile
        new java.util.zip.GZIPInputStream(new FileInputStream(mapping)).withCloseable { stream ->
            stream.newReader('UTF-8').eachLine { line ->
                if (!line.startsWith('\t')) {
                    def columns = line.split(' ')
                    if (columns.length == 2) owner = columns[1].replace('/', '.')
                } else if (owner != null && !line.startsWith('\t\t')) {
                    def columns = line.trim().split(' ')
                    if (selected.contains(columns[0])) {
                        String key = owner + '.' + columns[0]
                        aliases.computeIfAbsent(key) { new TreeSet<String>() }.add(columns[-1])
                    }
                }
            }
        }
        if (aliases.isEmpty()) throw new GradleException('Missing pinned reflection aliases')
        def output = destination.get().asFile
        output.parentFile.mkdirs()
        output.setText(aliases.collect { key, names -> key + '=' + names.join(',') }.join('\n') + '\n', 'UTF-8')
    }
}

def packagedTerrainCompatibilityProbe = renamer.classes(tasks.named('terrainCompatibilityProbeJar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    output = layout.buildDirectory.file('terrain-compatibility-fixture/terraincompatibilityprobe-reobf.jar')
}
tasks.register('packagedTerrainCompatibilityProbeJar') { dependsOn packagedTerrainCompatibilityProbe }
tasks.named('check') { dependsOn tasks.named('compileTerrainCompatibilityProbe') }
